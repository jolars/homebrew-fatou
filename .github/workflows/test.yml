name: Test formula

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One runner per platform branch in the formula, so every url+sha256
        # gets exercised: linux x86_64/arm64 and macOS intel/arm.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-13, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

      # brew audit/test refuse a path argument; register the working tree as a
      # tap so we can reference the formula by name.
      - name: Register working tree as tap
        run: |
          tap="$(brew --repository)/Library/Taps/jolars/homebrew-fatou"
          mkdir -p "$(dirname "$tap")"
          ln -s "$GITHUB_WORKSPACE" "$tap"

      - name: brew style
        run: brew style jolars/fatou/fatou

      - name: brew audit
        run: brew audit jolars/fatou/fatou

      - name: brew install (downloads + verifies sha256)
        run: brew install jolars/fatou/fatou

      - name: brew test
        run: brew test jolars/fatou/fatou
