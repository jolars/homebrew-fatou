name: Update formula

on:
  schedule:
    - cron: "0 6 * * *" # daily; new fatou releases appear within ~a day
  workflow_dispatch: # run on demand right after a release

permissions:
  contents: write # commit the updated formula to this repo via GITHUB_TOKEN

concurrency:
  group: update-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

      - name: Render formula from latest fatou release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/render-formula.sh

      - name: Detect change
        id: diff
        run: |
          if git diff --quiet -- Formula/fatou.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Formula already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Bot commits made with GITHUB_TOKEN do not trigger test.yml, so validate
      # the rendered formula here before publishing it. A broken upstream release
      # fails loudly instead of shipping a bad formula. (brew is put on PATH by
      # the setup-homebrew step above.)
      - name: Validate formula
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # brew audit/test refuse a path argument; register the working tree as
          # a tap so the rendered (uncommitted) formula can be referenced by name.
          tap="$(brew --repository)/Library/Taps/jolars/homebrew-fatou"
          mkdir -p "$(dirname "$tap")"
          ln -s "$GITHUB_WORKSPACE" "$tap"
          brew style jolars/fatou/fatou
          brew audit jolars/fatou/fatou
          brew install jolars/fatou/fatou
          brew test jolars/fatou/fatou

      - name: Commit
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Version is no longer a stanza (Homebrew scans it from the URL);
          # read it back from the release path for the commit message.
          version="$(grep -oE 'releases/download/v[^/]+' Formula/fatou.rb | head -1 | sed 's#releases/download/v##')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "fatou $version"
          # setup-homebrew disturbs checkout's persisted credentials, so push
          # with an explicitly authenticated remote URL.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
